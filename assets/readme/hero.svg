    <rect x="0" y="18" width="86" height="4" rx="2" fill="#ff8062"/>
    <text x="0" y="82" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="55" font-weight="700">workflow</text>
    <text x="0" y="136" fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700">BUILDER / PRODUCTION</text>
    <text x="0" y="177" fill="#fff" fill-opacity=".72" font-family="Arial, sans-serif" font-size="16">contract • script • preview • render • validate</text>
    <g transform="translate(0 205)">
      <rect width="128" height="28" rx="14" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/>
      <text x="16" y="19" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DESIGN LANGUAGE</text>
      <rect x="140" width="118" height="28" rx="14" fill="#fff" fill-opacity=".1" stroke="#fff" stroke-opacity=".18"/>
      <text x="156" y="19" fill="#fff" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">FEW-SHOT READY</text>
    </g>
  </g>
  <g filter="url(#shadow)">
    <g transform="translate(720 44) rotate(-7)">
      <rect width="280" height="178" rx="18" fill="#1c3158" stroke="#fff" stroke-opacity=".24"/>
      <rect width="280" height="32" rx="18" fill="#fff" fill-opacity=".12"/>
      <circle cx="22" cy="16" r="5" fill="#ff8062"/><circle cx="40" cy="16" r="5" fill="#9be3d1"/><circle cx="58" cy="16" r="5" fill="#fff" fill-opacity=".55"/>
      <text x="22" y="62" fill="#fff" font-family="Arial, sans-serif" font-size="12" font-weight="700">WORKFLOW CONTRACT</text>
      <path d="M22 82H250M22 102H204M22 122H231M22 142H166" stroke="#fff" stroke-opacity=".25" stroke-width="6" stroke-linecap="round"/>
      <rect x="198" y="52" width="54" height="24" rx="12" fill="#ff8062" fill-opacity=".88"/><text x="211" y="68" fill="#111b36" font-family="Arial, sans-serif" font-size="10" font-weight="700">PASS</text>
    </g>
    <g transform="translate(904 112) rotate(8)">
      <rect width="230" height="148" rx="16" fill="#b8d8ff" stroke="#fff" stroke-opacity=".2"/>
      <text x="20" y="31" fill="#111b36" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">TIMELINE PREVIEW</text>
      <path d="M22 62L62 45L98 72L137 38L184 60" fill="none" stroke="#111b36" stroke-opacity=".7" stroke-width="3"/>
      <circle cx="62" cy="45" r="6" fill="#ff8062"/><circle cx="137" cy="38" r="6" fill="#9be3d1"/>
      <rect x="20" y="96" width="164" height="12" rx="6" fill="#111b36" fill-opacity=".16"/>
