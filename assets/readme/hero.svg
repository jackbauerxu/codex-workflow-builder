<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">workflow builder — FROM REPEATABLE WORK TO PRODUCTION</title>
  <desc id="desc">A production skill for contracts, scripts, shots, previews and validated renders.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#111b36"/><stop offset="1" stop-color="#1f4c78"/></linearGradient>
    <linearGradient id="glow" x1="0" x2="1"><stop stop-color="#ff8062" stop-opacity=".32"/><stop offset="1" stop-color="#9be3d1" stop-opacity=".04"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <path d="M0 250C210 195 362 324 590 246S930 154 1200 224V320H0Z" fill="url(#glow)" opacity=".55"/>
