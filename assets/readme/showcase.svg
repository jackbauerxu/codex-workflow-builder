<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">workflow builder showcase wall</title><desc id="desc">The production objects that turn an idea into a repeatable render.</desc>
