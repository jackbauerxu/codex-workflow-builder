  <rect width="1200" height="280" rx="24" fill="#edf4ff"/><rect width="1200" height="280" rx="24" fill="url(#dots)"/>
  <text x="54" y="52" fill="#111b36" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">02 · PROJECT OBJECTS</text>
  <rect x="54" y="66" width="64" height="4" rx="2" fill="#ff8062"/>
  <text x="54" y="104" fill="#111b36" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700">Make the invisible production decisions visible</text>
